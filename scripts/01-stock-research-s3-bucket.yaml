AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Stock research dashboard - S3 bucket for the PDF notes users upload.
  General purpose bucket in the global namespace, all public access blocked,
  versioning enabled, SSE-S3 default encryption, Object Lock disabled, and a
  lifecycle rule that expires old versions.

# ---------------------------------------------------------------------------
# PARAMETERS - values you can choose when creating the stack
# ---------------------------------------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: stock-research-dashboard
    Description: Value of the Project and CostCenter tags on the bucket.
  Environment:
    Type: String
    Default: Prod
    AllowedValues: [Dev, Test, Prod]
    Description: Value of the Environment tag on the bucket.
  Team:
    Type: String
    Default: DevOps
    Description: Value of the Team tag on the bucket (team responsible).

Resources:
  # -------------------------------------------------------------------------
  # S3 BUCKET - stores the PDF notes uploaded through the dashboard.
  # Bucket names are global, so the account ID and Region are appended to
  # keep the name unique (max 63 characters).
  # Retain: deleting the stack must never delete users' notes.
  # -------------------------------------------------------------------------
  StockResearchBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub stock-research-bucket-${AWS::AccountId}-${AWS::Region}

      # Block all public access - the notes are private research.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      # Versioning - a delete only adds a delete marker, so an accidental
      # delete or overwrite can be recovered from the previous version.
      VersioningConfiguration:
        Status: Enabled

      # Default encryption - SSE-S3 (AES-256, keys managed by S3, no extra cost).
      # Bucket Key only reduces KMS calls, so it is irrelevant for SSE-S3.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: false

      # Object Lock disabled - users must be able to delete their own notes.
      # A locked object (WORM) cannot be deleted until its retention period
      # ends, and Object Lock cannot be turned off once enabled on a bucket.
      ObjectLockEnabled: false

      # Lifecycle - versioning keeps every old version forever, so clean up
      # what users can no longer see. No filter = applies to the whole bucket.
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            # Deleted/overwritten notes stay recoverable for 30 days.
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            # Remove delete markers left behind once all old versions expire.
            ExpiredObjectDeleteMarker: true
            # Failed large uploads leave billed, invisible parts behind.
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

      Tags:
        - Key: Name
          Value: stock-research-bucket
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Team
          Value: !Ref Team
        - Key: DataClassification
          Value: private
        - Key: CostCenter
          Value: !Ref ProjectName

# ---------------------------------------------------------------------------
# OUTPUTS - values other stacks and the dashboard need
# ---------------------------------------------------------------------------
Outputs:
  BucketName:
    Description: Name of the S3 bucket for uploaded PDF notes.
    Value: !Ref StockResearchBucket
  BucketArn:
    Description: ARN of the S3 bucket, used in IAM policies.
    Value: !GetAtt StockResearchBucket.Arn
