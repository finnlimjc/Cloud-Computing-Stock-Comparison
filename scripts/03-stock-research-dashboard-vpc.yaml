AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Stock research dashboard - VPC networking. Builds a VPC with 2 public and 2 private
  subnets across 2 Availability Zones, an Internet Gateway, one NAT Gateway per
  Availability Zone for the private subnets' outbound traffic, an S3 gateway endpoint,
  route tables, and the Web Security Group. The load balancer and the Auto Scaling
  instances that run the dashboard are in 05-stock-research-load-balancer.yaml.
  Region: us-east-1.

Resources:
  # -------------------------------------------------------------------------
  # TASK 1: VPC - our own private virtual network (10.0.0.0/16 = 65,536 IPs).
  # DNS hostnames must be enabled so instances get DNS names.
  # -------------------------------------------------------------------------
  LabVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: stock-research-dashboard-vpc

  # -------------------------------------------------------------------------
  # INTERNET GATEWAY - the door between the VPC and the internet.
  # It must be attached to the VPC before it can be used.
  # -------------------------------------------------------------------------
  LabInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: stock-research-dashboard-igw

  LabInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref LabVpc
      InternetGatewayId: !Ref LabInternetGateway

  # -------------------------------------------------------------------------
  # SUBNETS - slices of the VPC address range, each inside one Availability Zone.
  # Tasks 1 and 2: one public + one private subnet in AZ 1 (us-east-1a),
  # and one public + one private subnet in AZ 2 (us-east-1b).
  # "Public" vs "private" is decided by the route table, not the subnet itself.
  # -------------------------------------------------------------------------
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LabVpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: stock-research-dashboard-subnet-public1-us-east-1a

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LabVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: stock-research-dashboard-subnet-private1-us-east-1a

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LabVpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: stock-research-dashboard-subnet-public2-us-east-1b

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LabVpc
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: stock-research-dashboard-subnet-private2-us-east-1b

  # -------------------------------------------------------------------------
  # ROUTE TABLES - rules that say where network traffic goes.
  # Public route table: internet traffic (0.0.0.0/0) -> Internet Gateway.
  # Private route tables: one per AZ, outbound internet traffic (0.0.0.0/0) ->
  # the NAT Gateway in the same AZ.
  # Each subnet must be associated with a route table.
  # -------------------------------------------------------------------------
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref LabVpc
      Tags:
        - Key: Name
          Value: stock-research-dashboard-rtb-public

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: LabInternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref LabInternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref LabVpc
      Tags:
        - Key: Name
          Value: stock-research-dashboard-rtb-private1-us-east-1a

  PrivateDefaultRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway1

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref LabVpc
      Tags:
        - Key: Name
          Value: stock-research-dashboard-rtb-private2-us-east-1b

  PrivateDefaultRoute2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway2

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

  # -------------------------------------------------------------------------
  # NAT GATEWAYS - let the Auto Scaling instances in the private subnets start
  # outbound connections (git clone, pip, market-data APIs, SSM) while staying
  # unreachable from the internet. Inbound user traffic goes through the load
  # balancer instead (05-stock-research-load-balancer.yaml).
  # One per AZ, each in that AZ's public subnet: if one AZ fails, the private
  # subnet in the other AZ keeps its outbound access.
  # -------------------------------------------------------------------------
  NatGatewayEip1:
    Type: AWS::EC2::EIP
    DependsOn: LabInternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: stock-research-dashboard-eip-us-east-1a

  NatGateway1:
    Type: AWS::EC2::NatGateway
    Properties:
      SubnetId: !Ref PublicSubnet1
      AllocationId: !GetAtt NatGatewayEip1.AllocationId
      Tags:
        - Key: Name
          Value: stock-research-dashboard-nat-public1-us-east-1a

  NatGatewayEip2:
    Type: AWS::EC2::EIP
    DependsOn: LabInternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: stock-research-dashboard-eip-us-east-1b

  NatGateway2:
    Type: AWS::EC2::NatGateway
    Properties:
      SubnetId: !Ref PublicSubnet2
      AllocationId: !GetAtt NatGatewayEip2.AllocationId
      Tags:
        - Key: Name
          Value: stock-research-dashboard-nat-public2-us-east-1b

  # -------------------------------------------------------------------------
  # S3 GATEWAY ENDPOINT - private path to S3 for PDF note uploads. Free, and
  # traffic stays on the AWS network.
  # -------------------------------------------------------------------------
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref LabVpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PublicRouteTable
        - !Ref PrivateRouteTable1
        - !Ref PrivateRouteTable2
      Tags:
        - Key: Name
          Value: stock-research-dashboard-vpce-s3

  # -------------------------------------------------------------------------
  # TASK 3: SECURITY GROUP - a virtual firewall shared by the load balancer
  # (HTTP 80) and the Auto Scaling instances (Streamlit 8501). Inbound from
  # anywhere on IPv4. Outbound traffic is allowed by default.
  # -------------------------------------------------------------------------
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: Web Security Group
      GroupDescription: Enable HTTP access
      VpcId: !Ref LabVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Permit web requests
        - IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          CidrIp: 0.0.0.0/0
          Description: Permit Streamlit app
      Tags:
        - Key: Name
          Value: Web Security Group

# ---------------------------------------------------------------------------
# OUTPUTS - handy values shown on the stack's Outputs tab
# ---------------------------------------------------------------------------
Outputs:
  VpcId:
    Description: ID of stock-research-dashboard-vpc
    Value: !Ref LabVpc
